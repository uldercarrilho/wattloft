version: 2
updates:
  # Python / pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "ready-for-agent"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Plant-view Node / npm dependencies
  - package-ecosystem: "npm"
    directory: "/plant-view"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "ready-for-agent"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "ready-for-agent"
    groups:
      actions-dependencies:
        patterns:
          - "*"
