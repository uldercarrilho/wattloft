name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reclaim:
        description: Terminate and relaunch the pet VM, then reassign the reserved IPv4
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/uldercarrilho/wattloft

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Typecheck
        run: mypy

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_VAULT_OCID: ${{ vars.OCI_VAULT_OCID }}
      OCI_KEY_OCID: ${{ vars.OCI_KEY_OCID }}
      OCI_BASTION_OCID: ${{ vars.OCI_BASTION_OCID }}
      OCI_INSTANCE_OCID: ${{ vars.OCI_INSTANCE_OCID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      WATTLOFT_HOSTNAME: ${{ vars.WATTLOFT_HOSTNAME }}
      WATTLOFT_RESERVED_IPV4: ${{ vars.WATTLOFT_RESERVED_IPV4 }}
      WATTLOFT_IMAGE: ghcr.io/uldercarrilho/wattloft:${{ github.sha }}
      DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OCI CLI
        run: pip install oci-cli
      - name: Write SSH key
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > "$HOME/.oci/wattloft_deploy"
          chmod 600 "$HOME/.oci/wattloft_deploy"
          ssh-keygen -y -f "$HOME/.oci/wattloft_deploy" > "$HOME/.oci/wattloft_deploy.pub"
      - name: Reclaim VM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reclaim }}
        run: bash infra/reclaim-vm.sh
      - name: Point deSEC A record at reserved IPv4
        run: |
          if [[ -n "${DESEC_TOKEN:-}" ]]; then
            bash infra/desec-upsert.sh
          fi
      - name: Write secrets to Vault
        run: bash infra/write-vault-env.sh
      - name: compose pull && up through Bastion
        run: bash infra/bastion-exec.sh
