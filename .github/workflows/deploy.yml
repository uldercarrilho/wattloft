name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reclaim:
        description: Terminate and relaunch the pet VM, then reassign the reserved IPv4
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/uldercarrilho/wattloft
  PLANT_VIEW_IMAGE_NAME: ghcr.io/uldercarrilho/wattloft-plant-view

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-view/package-lock.json
      - name: Install
        run: pip install -e ".[dev]"
      - name: Plant view
        working-directory: plant-view
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Tests
        run: pytest -q
      - name: Typecheck
        run: mypy

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: plant-view
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.PLANT_VIEW_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.PLANT_VIEW_IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Container Security (Trivy)
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull images for scanning
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker pull ${{ env.PLANT_VIEW_IMAGE_NAME }}:${{ github.sha }}
      - name: Scan Wattloft image for CVEs
        run: |
          mkdir -p trivy-reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/trivy-reports:/reports" \
            ghcr.io/aquasecurity/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --output /reports/wattloft.txt \
            --exit-code 1 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Scan Plant-View image for CVEs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/trivy-reports:/reports" \
            ghcr.io/aquasecurity/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --output /reports/plant-view.txt \
            --exit-code 1 \
            ${{ env.PLANT_VIEW_IMAGE_NAME }}:${{ github.sha }}
      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-reports
          path: trivy-reports/

  dast:
    name: Ephemeral DAST (OWASP ZAP)
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Ephemeral App Container
        run: |
          docker pull ${{ env.PLANT_VIEW_IMAGE_NAME }}:${{ github.sha }}
          docker run -d --name plant-view-dast \
            --network host \
            -e OPERATOR_PASSWORD=ci-dast-test-token \
            -e WATTLOFT_API_URL=http://127.0.0.1:8000 \
            -e PLANT_VIEW_HOST=127.0.0.1 \
            -e PLANT_VIEW_PORT=3000 \
            -e COOKIE_SECURE=false \
            ${{ env.PLANT_VIEW_IMAGE_NAME }}:${{ github.sha }}

          echo "Waiting for plant-view to become responsive..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:3000 >/dev/null; then
              echo "Plant-view is ready!"
              break
            fi
            sleep 1
          done
      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-report
          chmod 777 zap-report
          docker run --rm --network host \
            -v "$(pwd)/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r zap_report.html \
            -J zap_report.json \
            -I || true
      - name: Stop Ephemeral App Container
        if: always()
        run: docker rm -f plant-view-dast || true
      - name: Upload ZAP DAST Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-dast-report
          path: zap-report/

  deploy:
    needs: [trivy-scan, dast]
    runs-on: ubuntu-24.04
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_VAULT_OCID: ${{ vars.OCI_VAULT_OCID }}
      OCI_KEY_OCID: ${{ vars.OCI_KEY_OCID }}
      OCI_BASTION_OCID: ${{ vars.OCI_BASTION_OCID }}
      OCI_INSTANCE_OCID: ${{ vars.OCI_INSTANCE_OCID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      WATTLOFT_HOSTNAME: ${{ vars.WATTLOFT_HOSTNAME }}
      WATTLOFT_RESERVED_IPV4: ${{ vars.WATTLOFT_RESERVED_IPV4 }}
      WATTLOFT_IMAGE: ghcr.io/uldercarrilho/wattloft:${{ github.sha }}
      WATTLOFT_PLANT_VIEW_IMAGE: ghcr.io/uldercarrilho/wattloft-plant-view:${{ github.sha }}
      DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OCI CLI
        run: pip install oci-cli
      - name: Write SSH key
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > "$HOME/.oci/wattloft_deploy"
          chmod 600 "$HOME/.oci/wattloft_deploy"
          ssh-keygen -y -f "$HOME/.oci/wattloft_deploy" > "$HOME/.oci/wattloft_deploy.pub"
      - name: Reclaim VM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reclaim }}
        run: bash infra/reclaim-vm.sh
      - name: Point deSEC A record at reserved IPv4
        run: |
          if [[ -n "${DESEC_TOKEN:-}" ]]; then
            bash infra/desec-upsert.sh
          fi
      - name: Write secrets to Vault
        run: bash infra/write-vault-env.sh
      - name: compose pull && up through Bastion
        run: bash infra/bastion-exec.sh
