name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-view/package-lock.json
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Python linting (ruff)
        run: ruff check src tests
      - name: Python typecheck (mypy)
        run: mypy
      - name: Plant-view install & typecheck
        working-directory: plant-view
        run: |
          npm ci
          npm run typecheck

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-view/package-lock.json
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Plant-view tests & build
        working-directory: plant-view
        run: |
          npm ci
          npm test
          npm run build
      - name: Python tests
        run: pytest -q

  sast:
    name: SAST (Semgrep & Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python Bandit SAST
        run: |
          pip install bandit
          mkdir -p sast-reports
          bandit -r src/ -s B104 -f txt -o sast-reports/bandit.txt || true
          cat sast-reports/bandit.txt
      - name: Polyglot Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan --config "p/security-audit" --config "p/secrets" --json -o /src/sast-reports/semgrep.json || true
      - name: Upload SAST Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-reports
          path: sast-reports/

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca-audit:
    name: Dependency Vulnerability Audit (SCA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-view/package-lock.json
      - name: Python dependency audit (pip-audit)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip-audit
      - name: Node dependency audit (npm audit)
        working-directory: plant-view
        run: npm audit --audit-level=high
