name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-view/package-lock.json
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Python linting (ruff)
        run: ruff check src tests
      - name: Python typecheck (mypy)
        run: mypy
      - name: Plant-view install & typecheck
        working-directory: plant-view
        run: |
          npm ci
          npm run typecheck

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-view/package-lock.json
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Plant-view tests & build
        working-directory: plant-view
        run: |
          npm ci
          npm test
          npm run build
      - name: Python tests
        run: pytest -q

  sast-codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca-audit:
    name: Dependency Vulnerability Audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-view/package-lock.json
      - name: Python dependency audit (pip-audit)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip-audit
      - name: Node dependency audit (npm audit)
        working-directory: plant-view
        run: npm audit --audit-level=high
