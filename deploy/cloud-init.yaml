#cloud-config
# E2.1.Micro is 1 GB RAM. Swap before apt or docker/oci-cli OOMs and sshd
# never becomes reachable for Bastion managed SSH.
bootcmd:
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
    fi
    swapon /swapfile || true

mounts:
  - ["/swapfile", "none", "swap", "sw", "0", "0"]

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - python3-pip
  - jq
  - curl
  - gzip

users:
  - name: ubuntu
    groups: [sudo, docker]
    lock_passwd: true

write_files:
  - path: /etc/wattloft/oci.env
    owner: root:root
    permissions: "0600"
    content: |
      OCI_COMPARTMENT_OCID=__OCI_COMPARTMENT_OCID__
      WATTLOFT_DUMP_BUCKET=wattloft-history-dumps
      WATTLOFT_COMPOSE_DIR=/opt/wattloft
      WATTLOFT_ENV_FILE=/etc/wattloft/wattloft.env

runcmd:
  - mkdir -p /opt/wattloft /etc/wattloft
  - chmod 700 /etc/wattloft
  - pip3 install --break-system-packages oci-cli
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

final_message: "wattloft cloud-init done"
