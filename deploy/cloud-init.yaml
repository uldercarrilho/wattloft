#cloud-config
# Do not run growpart/bootcmd swap: those raced on the Micro and failed the
# network stage, so packages, sshd keys, and the Bastion plugin never started.
growpart:
  mode: false

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - python3-pip
  - jq
  - curl
  - gzip

users:
  - name: ubuntu
    groups: [sudo, docker]
    lock_passwd: true

write_files:
  - path: /etc/wattloft/oci.env
    owner: root:root
    permissions: "0600"
    content: |
      OCI_COMPARTMENT_OCID=__OCI_COMPARTMENT_OCID__
      WATTLOFT_DUMP_BUCKET=wattloft-history-dumps
      WATTLOFT_COMPOSE_DIR=/opt/wattloft
      WATTLOFT_ENV_FILE=/etc/wattloft/wattloft.env

runcmd:
  - mkdir -p /opt/wattloft /etc/wattloft
  - chmod 700 /etc/wattloft
  - |
    if [ ! -f /swapfile ]; then
      dd if=/dev/zero of=/swapfile bs=1M count=2048
      chmod 600 /swapfile
      mkswap /swapfile
    fi
    swapon /swapfile || true
    grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - pip3 install --break-system-packages oci-cli
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

final_message: "wattloft cloud-init done"
