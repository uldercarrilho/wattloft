services:
  wattloft:
    image: ${WATTLOFT_IMAGE:-ghcr.io/uldercarrilho/wattloft:main}
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/wattloft/wattloft.env
    environment:
      WATTLOFT_API_HOST: "127.0.0.1"
      WATTLOFT_API_PORT: "8000"
      INGEST_HOST: "0.0.0.0"
      INGEST_PORT: "10000"
      INGEST_MAX_CONNECTIONS_PER_IP: "10"
      INGEST_IDLE_TIMEOUT_S: "60"
  plant-view:
    image: ${WATTLOFT_PLANT_VIEW_IMAGE:-ghcr.io/uldercarrilho/wattloft-plant-view:main}
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/wattloft/wattloft.env
    environment:
      WATTLOFT_API_URL: "http://127.0.0.1:8000"
      PLANT_VIEW_HOST: "127.0.0.1"
      PLANT_VIEW_PORT: "3000"
      COOKIE_SECURE: "true"
  caddy:
    image: caddy:2.11.4
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/wattloft/wattloft.env
    environment:
      PLANT_VIEW_PORT: "3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
