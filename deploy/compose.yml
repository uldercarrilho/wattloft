services:
  wattloft:
    image: ${WATTLOFT_IMAGE:-ghcr.io/uldercarrilho/wattloft:main}
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/wattloft/wattloft.env
    environment:
      PLANT_VIEW_HOST: "127.0.0.1"
      PLANT_VIEW_PORT: "8000"
      INGEST_HOST: "0.0.0.0"
      INGEST_PORT: "10000"
  caddy:
    image: caddy:2.11.4
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/wattloft/wattloft.env
    environment:
      PLANT_VIEW_PORT: "8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
